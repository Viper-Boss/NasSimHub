<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#0b1020; font:12px system-ui; color:#8fa3c8; }
  .row { display:flex; gap:18px; padding:18px; }
  .cell { display:grid; gap:6px; justify-items:center; }
  .surface { width:320px; padding:16px; border-radius:14px; }
  .surface.dark { background:#131b2e; border:1px solid #223} 
  .surface.light { background:#f6f8fc; border:1px solid #dfe5ef }
  canvas { display:block; width:320px; height:320px; border-radius:12px; }
  .surface.dark canvas { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 8%); }
  .surface.light canvas { box-shadow: inset 0 0 0 1px rgb(16 28 56 / 24%); }
</style></head><body>
<div class="row">
  <div class="cell"><div class="surface dark"><canvas id="dark-off"></canvas></div><span>dark · DHT off (0 peers)</span></div>
  <div class="cell"><div class="surface dark"><canvas id="dark-live"></canvas></div><span>dark · 14 peers</span></div>
  <div class="cell"><div class="surface light"><canvas id="light-off"></canvas></div><span>light · DHT off</span></div>
  <div class="cell"><div class="surface light"><canvas id="light-live"></canvas></div><span>light · 14 peers</span></div>
</div>
<script src="./mesh-preview.js"></script>
</body></html>
