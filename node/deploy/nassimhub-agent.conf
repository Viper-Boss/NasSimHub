# NasSimHub Node agent configuration.
#
# Format: one `key = value` per line. `#` starts a comment. An unknown setting
# is an error with a line number rather than a warning, so a typo stops the
# device instead of being silently ignored.
#
# Flags override this file, so one setting can be changed for one run without
# editing anything:
#     nassimhub-agent -config /etc/nassimhub/agent.conf -listen 127.0.0.1:7580
#
# Nothing in this file is confidential. The device identity key is generated on
# the device and lives in state_dir, and no credential of any kind belongs here -
# nothing in the agent reads one from configuration.

# Where the device identity and pairing state live. This MUST be on persistent
# storage. A device whose state_dir is a tmpfs regenerates its identity on every
# boot and appears on the NAS as a new device each time.
state_dir = /var/lib/nassimhub

# Rotating diagnostic log. Leave empty to keep logs in memory only, which is
# what you want on a device with a small or worn flash.
log_dir = /var/log/nassimhub

# Addresses to serve the Node protocol on, comma separated. The same protocol is
# served on every one of them: a Node does not know or care whether a request
# arrived over USB or Wi-Fi.
#
# 10.55.0.2 is this device's end of the USB network; 0.0.0.0 also covers Wi-Fi.
listen = 0.0.0.0:7580

# msm8916 is the real hardware backend. Unverified functions remain disabled
# and answer "not supported" with a reason.
# mock is the software Node, which implements every state the protocol defines.
modem_backend = msm8916

# Recorded in the device identity and baked into device_id. Changing it changes
# the device's identity, so it is set once when the device is first provisioned
# and never afterwards.
platform = msm8916
model = UFI003

# Only used when modem_backend = mock: mobile, unicom or telecom.
mock_scenario = mobile

# Recorded for the future hardware backend; unused in this stage.
# qmi_device = /dev/cdc-wdm0
# audio_card = hw:nassimhubufi003
# Experimental call control and ALSA media stay disabled until the matching
# audio DTB, modules, holder, systemd permission drop-in and NAS bridge are ready.
voice_media = false

# TLS is on unless this is turned on. The device certificate is issued from the
# device identity key, so there is nothing to install and nothing to expire that
# a restart cannot reissue. Turn it on only for local development.
plaintext = false

# Answer DNS-SD browse queries so the NAS can find this device. Announcements
# carry the device id, platform, protocol version and whether it is already
# paired - and nothing else.
announce = true

# Serve the first-boot Wi-Fi setup API and page while the device is in its own
# access point. Both disappear the moment the device joins a network.
provisioning = true

# How long a Core session token is valid. Empty uses the built-in default.
# session_ttl = 30m

# Update source. Leave update_url empty to disable update checks entirely, which
# is the default: this stage ships no installer, so a check would only ever
# report that an update exists and cannot be applied.
# update_url = https://updates.example.invalid/nassimhub/manifest.json
update_channel = stable

# --- security and transport -------------------------------------------------

# The security level. One setting, three values, and the one most deployments
# should ever touch:
#
#   STANDARD     TLS 1.3 with hybrid preferred and classical permitted.
#                Ed25519 identity. Reachable from any NAS.
#   PQ           X25519MLKEM768 REQUIRED. A NAS that cannot do post-quantum key
#                agreement cannot connect - it fails, it does not fall back.
#   PQ_EXTREME   SecP384r1MLKEM1024 REQUIRED, post-quantum identity REQUIRED,
#                dual-signed updates REQUIRED. Nothing about it degrades.
#
# PQ_EXTREME needs a Go 1.26 toolchain for the SecP hybrid groups, and its
# identity and update requirements need ML-DSA, expected in Go 1.27. A build
# that cannot satisfy the level says so and REFUSES to start rather than running
# at a lower level - a device that quietly ran PQ where PQ_EXTREME was asked for
# would be worse than one that did not start.
#
# When this is set it decides pq_profile and pq_policy below. Those remain
# readable so a configuration written before levels existed still works.
security_level = STANDARD

# How much post-quantum IDENTITY to demand of the peer. This is a different
# question from the key agreement above: ML-KEM protects the session key,
# ML-DSA proves who the peer is, and having the first is not having the second.
#
#   optional   accept a peer with no post-quantum identity (the only value that
#              works today, since no build can produce one yet)
#   preferred  use it when present, say so plainly when absent
#   required   refuse a peer without one
pq_identity_policy = optional

# Whether an update must carry both a classical and a post-quantum signature.
#
#   preferred  a classical-only manifest installs, and the UI and diagnostics
#              say "classical-only" rather than staying quiet about it
#   required   refuse to install anything that is not dual-signed
#
# preferred is the only usable default until publishers can dual-sign: required
# on a fleet whose publisher cannot would refuse every update, including the one
# that would fix that.
ota_signature_policy = preferred

# Post-quantum key agreement for the TLS handshake.
#
# pq_standard offers X25519MLKEM768, which is what the ecosystem has settled on.
# pq_extreme also allows SecP384r1MLKEM1024, which costs more handshake bytes
# and more CPU on a device that has little of either - and which needs Go 1.25
# or later to be available at all.
#
# This only strengthens the SESSION key. The device identity stays Ed25519, and
# device_id, pairing and certificate pinning are unchanged.
pq_profile = pq_standard

# preferred offers post-quantum first and accepts a classical handshake if the
# NAS cannot do one - with the UI required to say so plainly.
# required offers ONLY post-quantum groups, so a NAS that cannot do one gets a
# handshake failure. There is no silent downgrade because there is no classical
# group on offer to downgrade to.
#
# preferred is the default on a DEVICE. A Node that required post-quantum would
# become unreachable from an older NAS the moment it was updated, and a device
# the owner cannot reach is worse than a session key that is merely as good as
# last year's.
pq_policy = preferred

# How bytes are carried. standard is TCP and is what you want unless something
# specific is wrong. kcp is a reliable stream over UDP for links that lose
# packets; it costs bandwidth and is worth it above roughly 2% loss. quic is not
# implemented in this build. auto resolves conservatively and never picks kcp on
# its own.
transport_mode = standard

# Only used when transport_mode = kcp.
#
# balanced keeps a congestion window, so the device backs off when the link is
# genuinely congested rather than shouting over the rest of the household.
# aggressive removes it: faster on a marginal cellular link whose loss is not
# congestion, antisocial on a link where it is.
kcp_profile = balanced

# Forward error correction, only used when transport_mode = kcp. off, balanced
# (10% overhead) or aggressive (25%). Parity recovers a lost packet without a
# round trip, which is worth a lot on a long link and nothing on a clean one.
kcp_fec = off
