services:
  api:
    environment:
      MODEMDECK_UPDATER_URL: ${MODEMDECK_UPDATER_URL:-}
      MODEMDECK_UPDATER_TOKEN_FILE: /run/secrets/modemdeck_updater_token
    secrets:
      - modemdeck_updater_token

  updater:
    profiles:
      - ota
    image: ${MODEMDECK_UPDATER_IMAGE_REF:-${MODEMDECK_UPDATER_IMAGE:-modemdeck-updater}:${MODEMDECK_UPDATER_VERSION:-dev}}
    restart: unless-stopped
    user: "0:0"
    expose:
      - "8081"
    environment:
      MODEMDECK_DEPLOYMENT_DIR: ${MODEMDECK_DEPLOYMENT_DIR:?MODEMDECK_DEPLOYMENT_DIR must be the absolute host deployment directory}
      MODEMDECK_HOST_DEPLOYMENT_DIR: ${MODEMDECK_DEPLOYMENT_DIR:?MODEMDECK_DEPLOYMENT_DIR must be the absolute host deployment directory}
      MODEMDECK_UPDATER_LISTEN_ADDRESS: 0.0.0.0:8081
      MODEMDECK_UPDATER_SELF_IMAGE: ${MODEMDECK_UPDATER_SELF_IMAGE:-disabled}
      MODEMDECK_UPDATER_STATE_DIR: /var/lib/modemdeck-updater
      MODEMDECK_UPDATER_STATE_VOLUME: ${MODEMDECK_UPDATER_STATE_VOLUME:-modemdeck-updater-state}
      MODEMDECK_UPDATER_TOKEN_FILE: /run/secrets/modemdeck_updater_token
      MODEMDECK_CLOUDFLARE_ENABLED: ${MODEMDECK_CLOUDFLARE_ENABLED:-false}
      # No running-version override here, on purpose: anything a release
      # changes must not appear in this service, or every release would
      # recreate the updater mid-install (deploy/tests/static-test.sh). The
      # updater records what it installed in its state volume instead.
      # Where to look for the SIGNED stable release, as a comma-separated list
      # of URLs. Empty uses the built-in list: the public release repository
      # Viper-Boss/nassimhub-releases, served by GitHub and by jsDelivr.
      #
      # Every URL is asked and the highest version that VERIFIES wins, so
      # adding a mirror -- a Gitee copy, an object bucket, a file on the LAN
      # -- is safe: a mirror controls which bytes arrive, never which bytes
      # are accepted, and one honest mirror outvotes any number of stale
      # ones. (This replaced MODEMDECK_RELEASE_MANIFEST_URL_TEMPLATE, which
      # pointed into the private source repository and so could never be
      # fetched by a gateway.)
      MODEMDECK_RELEASE_CHANNEL_URLS: ${MODEMDECK_RELEASE_CHANNEL_URLS:-}
      # How an install replaces images. Empty means "env": write digest-pinned
      # references into this deployment's .env, which is what this Compose
      # stack is built for. "retag" is for stacks whose Compose file names
      # fixed local image tags (the fnOS package); it needs the four settings
      # below it. See internal/ota/docker_runtime.go.
      MODEMDECK_UPDATE_STRATEGY: ${MODEMDECK_UPDATE_STRATEGY:-}
      MODEMDECK_COMPOSE_PROJECT: ${MODEMDECK_COMPOSE_PROJECT:-}
      MODEMDECK_COMPOSE_FILES: ${MODEMDECK_COMPOSE_FILES:-}
      MODEMDECK_COMPOSE_PROFILES: ${MODEMDECK_COMPOSE_PROFILES:-}
      MODEMDECK_UPDATE_SLOTS: ${MODEMDECK_UPDATE_SLOTS:-}
      MODEMDECK_UPDATE_SERVICES: ${MODEMDECK_UPDATE_SERVICES:-}
      # Registry namespaces carrying the same images as ghcr.io/viper-boss,
      # tried after it (retag strategy). Images are pulled BY DIGEST, which
      # Docker verifies, so a mirror can fail a pull but cannot change what
      # arrives. E.g. registry.cn-hangzhou.aliyuncs.com/<your-namespace>
      MODEMDECK_REGISTRY_MIRRORS: ${MODEMDECK_REGISTRY_MIRRORS:-}
    secrets:
      - modemdeck_updater_token
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${MODEMDECK_DEPLOYMENT_DIR:?MODEMDECK_DEPLOYMENT_DIR must be the absolute host deployment directory}
        target: ${MODEMDECK_DEPLOYMENT_DIR:?MODEMDECK_DEPLOYMENT_DIR must be the absolute host deployment directory}
      - type: volume
        source: updater-state
        target: /var/lib/modemdeck-updater
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -T
        - "3"
        - -O
        - /dev/null
        - http://127.0.0.1:8081/health
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 4
    stop_grace_period: 10s

secrets:
  modemdeck_updater_token:
    file: ${MODEMDECK_UPDATER_TOKEN_FILE:?MODEMDECK_UPDATER_TOKEN_FILE must point to a host secret file}

volumes:
  updater-state:
    name: ${MODEMDECK_UPDATER_STATE_VOLUME:-modemdeck-updater-state}
