# Merge from the repository root with docker-compose.yml. No cloud/OTA service.
name: nas-comm-gateway
services:
  hardware:
    container_name: nas-comm-hardware
    image: nas-comm-hardware:fnos-local-0.1
    # WireGuard data plane (r80): the agent creates/deletes wg interfaces via
    # the wg(8) and ip(8) tools, which needs CAP_NET_ADMIN in the host network
    # namespace. The kernel module itself is provided by the fnOS kernel.
    cap_add:
      - NET_ADMIN
    # Host PID namespace so the system-metrics panel reports the real host
    # process/thread counts (task-manager style dashboard), not the
    # container's.
    pid: "host"
    # Reviewed QDC507 module voice runtime. The host directory holding the four
    # reviewed artifacts (manifest.json, qdc507_aprv3.ko, qdc507_voice.ko,
    # mavo-pcm-bridge.armv7) is bind-mounted read-only at /tmp/qdc507-voice.
    # /tmp is a writable tmpfs in this container, so the agent can create its
    # ADB state directory sibling /tmp/qdc507-adb next to it (the agent derives
    # the state dir as <runtime dir parent>/qdc507-adb and the rootfs is
    # read-only). MODEMDECK_QDC507_VOICE_RUNTIME_DIR (host path, set in
    # .env.fnos) only selects the bind source; the in-container env is pinned
    # to the /tmp path below.
    environment:
      MODEMDECK_QDC507_VOICE_RUNTIME_DIR: /tmp/qdc507-voice
      # 4G traffic counters are accumulated across interface resets and
      # container restarts in this persisted state file.
      MODEMDECK_TRAFFIC_STATE_FILE: /var/lib/modemdeck/state/traffic-counters.json
    volumes:
      - type: bind
        source: ${MODEMDECK_QDC507_VOICE_RUNTIME_DIR:?Set MODEMDECK_QDC507_VOICE_RUNTIME_DIR to a host directory holding the reviewed QDC507 voice runtime}
        target: /tmp/qdc507-voice
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEMDECK_DATA_DIR:?Set an absolute dedicated NAS data directory}/agent-state
        target: /var/lib/modemdeck/state
  api:
    container_name: nas-comm-api
    # fnOS trim-kernel storage sandbox: only fsuid 0 can access /mnt/docker-data
    # -- verified on the NAS (2026-11-02): uid 10001 cannot open even the
    # directories it owns. Root is therefore required, but privileged is
    # not: root needs only DAC_OVERRIDE to read and write the 10001-owned
    # data, and FOWNER for the chmod calls in tlsmanager and recording. The
    # base file's cap_drop ALL, read_only and no-new-privileges still apply.
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - label=disable

    image: nas-comm-api:fnos-local-0.1
    environment:
      MODEMDECK_RECORDINGS_PATH: /var/lib/modemdeck/recordings
      # The built-in NKN node runs as a separate container with ports mapped
      # to the host; inside this (bridge-networked) container 127.0.0.1 is the
      # container itself, so reach the node's RPC through the host gateway.
      HOMESIM_NKN_NODE_RPC: http://host.docker.internal:30003
      # Browser call audio is P2P UDP and the browser cannot reach this
      # container's internal address, so Pion must advertise the NAS address
      # and carry every call over the single UDP port mapped below.
      # Empty disables the override (call audio then relies on relay/TURN only).
      MODEMDECK_CALL_MEDIA_PUBLIC_IPS: ${MODEMDECK_CALL_MEDIA_PUBLIC_IPS:-}
      MODEMDECK_CALL_MEDIA_UDP_PORT: "7881"
    # One shared UDP port for all call media (Pion ICE UDP mux). Without this
    # mapping ICE never completes and calls connect with no audio.
    ports:
      - "7881:7881/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Forwarder credentials (ServerChan/PushPlus/Bark/NKN seeds/...) live on
    # the NAS host in this file as HOMESIM_* environment variables and are
    # injected wholesale; only variable NAMES are stored in forwarder configs.
    env_file:
      - /mnt/docker-data/homesim/credentials.env
    volumes:
      - type: bind
        source: ${MODEMDECK_DATA_DIR:?Set an absolute dedicated NAS data directory}
        target: /var/lib/modemdeck
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEMDECK_RECORDINGS_DIR:?Set an absolute dedicated NAS recordings directory}
        target: /var/lib/modemdeck/recordings
        bind:
          create_host_path: false
  modemdeck:
    container_name: nas-comm-web
    # fnOS trim-kernel storage sandbox: only fsuid 0 can access /mnt/docker-data
    # (see api above). Not privileged: nginx started as root needs
    # DAC_OVERRIDE for the TLS directory, CHOWN for its temp paths in /tmp and
    # SETUID/SETGID to drop its workers to the nginx user. Verified on the NAS
    # with the base file's read_only, tmpfs /tmp and no-new-privileges.
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - label=disable

    image: nas-comm-web:fnos-local-0.1
    volumes:
      - type: bind
        source: ${MODEMDECK_DATA_DIR:?Set an absolute dedicated NAS data directory}/tls
        target: /var/lib/modemdeck/tls
        read_only: true
        bind:
          create_host_path: false
