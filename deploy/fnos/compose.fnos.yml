# Merge from the repository root with docker-compose.yml. No cloud/OTA service.
name: nas-comm-gateway
services:
  hardware:
    container_name: nas-comm-hardware
    image: nas-comm-hardware:fnos-local-0.1
    # Reviewed QDC507 module voice runtime. The host directory holding the four
    # reviewed artifacts (manifest.json, qdc507_aprv3.ko, qdc507_voice.ko,
    # mavo-pcm-bridge.armv7) is bind-mounted read-only at /tmp/qdc507-voice.
    # /tmp is a writable tmpfs in this container, so the agent can create its
    # ADB state directory sibling /tmp/qdc507-adb next to it (the agent derives
    # the state dir as <runtime dir parent>/qdc507-adb and the rootfs is
    # read-only). MODEMDECK_QDC507_VOICE_RUNTIME_DIR (host path, set in
    # .env.fnos) only selects the bind source; the in-container env is pinned
    # to the /tmp path below.
    environment:
      MODEMDECK_QDC507_VOICE_RUNTIME_DIR: /tmp/qdc507-voice
    volumes:
      - type: bind
        source: ${MODEMDECK_QDC507_VOICE_RUNTIME_DIR:?Set MODEMDECK_QDC507_VOICE_RUNTIME_DIR to a host directory holding the reviewed QDC507 voice runtime}
        target: /tmp/qdc507-voice
        read_only: true
        bind:
          create_host_path: false
  api:
    container_name: nas-comm-api
    image: nas-comm-api:fnos-local-0.1
    environment:
      MODEMDECK_RECORDINGS_PATH: /var/lib/modemdeck/recordings
      # The built-in NKN node runs as a separate container with ports mapped
      # to the host; inside this (bridge-networked) container 127.0.0.1 is the
      # container itself, so reach the node's RPC through the host gateway.
      HOMESIM_NKN_NODE_RPC: http://host.docker.internal:30003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Forwarder credentials (ServerChan/PushPlus/Bark/NKN seeds/...) live on
    # the NAS host in this file as HOMESIM_* environment variables and are
    # injected wholesale; only variable NAMES are stored in forwarder configs.
    env_file:
      - /mnt/docker-data/homesim/credentials.env
    volumes:
      - type: bind
        source: ${MODEMDECK_DATA_DIR:?Set an absolute dedicated NAS data directory}
        target: /var/lib/modemdeck
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEMDECK_RECORDINGS_DIR:?Set an absolute dedicated NAS recordings directory}
        target: /var/lib/modemdeck/recordings
        bind:
          create_host_path: false
  modemdeck:
    container_name: nas-comm-web
    image: nas-comm-web:fnos-local-0.1
    volumes:
      - type: bind
        source: ${MODEMDECK_DATA_DIR:?Set an absolute dedicated NAS data directory}/tls
        target: /var/lib/modemdeck/tls
        read_only: true
        bind:
          create_host_path: false
